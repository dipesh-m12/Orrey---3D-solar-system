<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrery — 3D Solar System Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef1f7;--dim:#8d96ab;--line:rgba(255,255,255,.12);--glass:rgba(12,15,26,.66);--accent:#ffb454}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060b;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:5}
.brand{top:22px;left:24px;pointer-events:none}
.brand h1{font-size:20px;letter-spacing:.34em;font-weight:700}
.brand p{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:.04em}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px}
nav{left:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:8px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border-radius:9px;font-size:13px;color:var(--dim);transition:.2s}
nav button i{width:9px;height:9px;border-radius:50%;flex:none}
nav button:hover,nav button:focus-visible{color:var(--ink);background:rgba(255,255,255,.07)}
nav button.on{color:var(--ink);background:rgba(255,255,255,.11)}
.card{right:24px;top:22px;width:300px;padding:22px;opacity:0;transform:translateX(16px);pointer-events:none;transition:.35s}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .kind{font:500 11px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.card h2{font-size:34px;font-weight:700;margin:6px 0 10px;line-height:1}
.card p{font-size:13.5px;line-height:1.55;color:#c3c9d8}
.card dl{margin-top:16px;border-top:1px solid var(--line)}
.card dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.card dt{color:var(--dim)}
.card dd{font-family:"JetBrains Mono",monospace;text-align:right}
.card .x{all:unset;cursor:pointer;position:absolute;top:14px;right:16px;color:var(--dim);font-size:20px;line-height:1;padding:4px}
.card .x:hover{color:var(--ink)}
.bar{left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:12px;color:var(--dim);white-space:nowrap}
.bar button{all:unset;cursor:pointer;color:var(--ink);padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.bar button:hover,.bar button:focus-visible{background:rgba(255,255,255,.09)}
.bar input{accent-color:var(--accent);width:120px}
.bar output{font-family:"JetBrains Mono",monospace;color:var(--ink);min-width:34px}
.lbl{position:fixed;z-index:3;transform:translate(-50%,-100%);font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(238,241,247,.72);cursor:pointer;padding:4px 6px;user-select:none;text-shadow:0 0 6px #000;will-change:left,top}
.lbl:hover{color:#fff}
.hint{right:24px;bottom:26px;font-size:11px;color:var(--dim);letter-spacing:.04em;pointer-events:none}
#fail{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:30px;color:var(--dim)}
@media (max-width:760px){
  .brand{top:14px;left:16px}.brand p{display:none}
  nav{left:0;right:0;top:auto;bottom:70px;transform:none;flex-direction:row;overflow-x:auto;border-radius:0;border-left:0;border-right:0;padding:6px 10px}
  nav button{flex:none;padding:7px 10px}
  .card{left:12px;right:12px;top:48px;width:auto;padding:16px}
  .card h2{font-size:26px}.card p{font-size:12.5px}
  .card dl div{padding:6px 0}
  .bar{bottom:12px;gap:8px;padding:8px 10px}.bar input{width:80px}.bar .t{display:none}
  .hint{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fail">This page needs WebGL, which your browser has switched off or doesn't support.</div>

<header class="ui brand"><h1>ORRERY</h1><p>A living model of the solar system</p></header>
<nav class="ui glass" id="nav" aria-label="Bodies"></nav>

<aside class="ui glass card" id="card" aria-live="polite">
  <button class="x" id="close" aria-label="Back to overview">×</button>
  <div class="kind" id="kind"></div>
  <h2 id="name"></h2>
  <p id="desc"></p>
  <dl id="facts"></dl>
</aside>

<div class="ui glass bar">
  <button id="play" aria-label="Pause or play">Pause</button>
  <span class="t">Speed</span>
  <input id="speed" type="range" min="0" max="5" step="0.1" value="1" aria-label="Orbit speed">
  <output id="spv">1.0×</output>
  <button id="home">Overview</button>
</div>
<div class="ui hint">Drag to orbit · scroll to zoom · click a planet · sizes &amp; distances compressed</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('fail').style.display='grid';return}
const $=id=>document.getElementById(id);
const BODIES=[
 {n:'Sun',k:'Star',c:'#ffb454',r:6,d:0,p:0,pal:['#ffd27a','#ff9a2e','#ff7a18','#ffc85a'],
  desc:'A middle-aged yellow dwarf that holds everything here in orbit. Its core fuses about 600 million tonnes of hydrogen every second.',
  f:[['Diameter','1,392,700 km'],['Surface','≈ 5,500 °C'],['Share of system mass','99.86 %'],['Age','4.6 billion yr']]},
 {n:'Mercury',k:'Rocky planet',c:'#a9a29a',r:.55,d:11,p:.241,pal:['#8c857d','#a9a29a','#6f6963','#b8b0a6'],sp:1,
  desc:'The smallest planet and the fastest. With almost no atmosphere, its surface swings from 430 °C by day to −180 °C at night.',
  f:[['Diameter','4,879 km'],['Year','88 days'],['Rotation','58.6 days'],['Moons','0'],['From Sun','0.39 AU']]},
 {n:'Venus',k:'Rocky planet',c:'#e3c58b',r:.9,d:15.5,p:.615,pal:['#e8cf9c','#d9b676','#f0dcb0','#cfa765'],b:1,
  desc:'Wrapped in thick carbon-dioxide clouds, Venus is the hottest planet. It spins backwards, and so slowly that its day outlasts its year.',
  f:[['Diameter','12,104 km'],['Year','225 days'],['Rotation','243 days'],['Moons','0'],['From Sun','0.72 AU']]},
 {n:'Earth',k:'Rocky planet',c:'#5aa2ff',r:1,d:20.5,p:1,earth:1,moon:1,tilt:.41,
  desc:'The only world known to host life, with liquid water across 71 % of its surface and a single large moon steadying its tilt.',
  f:[['Diameter','12,756 km'],['Year','365.25 days'],['Rotation','23 h 56 m'],['Moons','1'],['From Sun','1 AU']]},
 {n:'Mars',k:'Rocky planet',c:'#e0714a',r:.7,d:26.5,p:1.881,pal:['#c8552f','#e0714a','#a8431f','#d98a5e'],sp:1,tilt:.44,
  desc:'A cold desert coloured by iron oxide. It has the tallest volcano in the solar system, Olympus Mons, about 22 km high.',
  f:[['Diameter','6,792 km'],['Year','687 days'],['Rotation','24 h 37 m'],['Moons','2'],['From Sun','1.52 AU']]},
 {n:'Jupiter',k:'Gas giant',c:'#d9a877',r:3.1,d:38,p:11.86,pal:['#e6c9a0','#c48f5c','#f1dfc2','#a96f45','#dcb487'],b:1,tilt:.05,
  desc:'More massive than all the other planets combined. Its Great Red Spot is a storm wider than Earth that has raged for centuries.',
  f:[['Diameter','142,984 km'],['Year','11.9 yr'],['Rotation','9 h 56 m'],['Moons','95+'],['From Sun','5.2 AU']]},
 {n:'Saturn',k:'Gas giant',c:'#e8d39a',r:2.6,d:52,p:29.45,pal:['#efe0b0','#d8c084','#f5ebc8','#c9ad70'],b:1,ring:1,tilt:.47,
  desc:'Famous for rings of ice and rock that span 280,000 km yet are mostly only tens of metres thick. Light enough to float in water.',
  f:[['Diameter','120,536 km'],['Year','29.5 yr'],['Rotation','10 h 42 m'],['Moons','270+'],['From Sun','9.58 AU']]},
 {n:'Uranus',k:'Ice giant',c:'#9fe3e6',r:1.7,d:64,p:84,pal:['#a8e6e8','#93dadd','#b9eef0'],b:1,tilt:1.4,
  desc:'An ice giant tipped on its side, rolling around the Sun like a ball. Each pole gets 42 years of sunlight, then 42 of darkness.',
  f:[['Diameter','51,118 km'],['Year','84 yr'],['Rotation','17 h 14 m'],['Moons','28+'],['From Sun','19.2 AU']]},
 {n:'Neptune',k:'Ice giant',c:'#4f78ff',r:1.6,d:75,p:164.8,pal:['#3f66e8','#5580ff','#3457cc','#6b91ff'],b:1,tilt:.49,
  desc:'The most distant planet, found by mathematics before it was seen. Its winds are the fastest known, topping 2,000 km/h.',
  f:[['Diameter','49,528 km'],['Year','164.8 yr'],['Rotation','16 h 6 m'],['Moons','16'],['From Sun','30.1 AU']]}
];

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true})}
catch(e){$('fail').style.display='grid';return}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,3000);
const HOME=new THREE.Vector3(0,48,104);
cam.position.set(0,140,260);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.enableDamping=true;ctl.dampingFactor=.07;ctl.enablePan=false;ctl.minDistance=3;ctl.maxDistance=320;

/* seeded random so textures look the same each visit */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

function tex(b){
  const w=512,h=256,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');
  if(b.earth){
    g.fillStyle='#1d4f9e';g.fillRect(0,0,w,h);
    for(let i=0;i<26;i++){const x=rnd()*w,y=40+rnd()*(h-80),s=14+rnd()*40;
      g.fillStyle=rnd()>.4?'#3f8f4d':'#8a9a55';
      for(let j=0;j<7;j++){g.beginPath();g.ellipse(x+(rnd()-.5)*s*1.6,y+(rnd()-.5)*s,s*(.3+rnd()*.5),s*(.2+rnd()*.4),rnd()*3,0,7);g.fill()}}
    g.fillStyle='#f4f8ff';g.fillRect(0,0,w,13);g.fillRect(0,h-16,w,16);
    g.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<60;i++){g.beginPath();g.ellipse(rnd()*w,rnd()*h,10+rnd()*34,2+rnd()*5,0,0,7);g.fill()}
  }else if(b.b){
    let y=0;while(y<h){const t=3+rnd()*(b.r>2?22:34);g.fillStyle=b.pal[(rnd()*b.pal.length)|0];g.fillRect(0,y,w,t+1);y+=t}
    g.globalAlpha=.16;
    for(let i=0;i<500;i++){g.fillStyle=b.pal[(rnd()*b.pal.length)|0];g.fillRect(rnd()*w,rnd()*h,20+rnd()*90,1+rnd()*2)}
    g.globalAlpha=1;
    if(b.n==='Jupiter'){g.fillStyle='#b5502f';g.beginPath();g.ellipse(330,160,26,13,0,0,7);g.fill()}
  }else{
    g.fillStyle=b.pal[0];g.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){g.globalAlpha=.1+rnd()*.3;g.fillStyle=b.pal[(rnd()*b.pal.length)|0];
      g.beginPath();g.arc(rnd()*w,rnd()*h,1+rnd()*(b.d?9:16),0,7);g.fill()}
    g.globalAlpha=1;
  }
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t;
}
function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,214,140,1)');gr.addColorStop(.2,'rgba(255,170,70,.55)');
  gr.addColorStop(.5,'rgba(255,120,30,.14)');gr.addColorStop(1,'rgba(255,100,20,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(cv);
}

/* stars */
(function(){
  const n=4500,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const u=rnd()*2-1,th=rnd()*Math.PI*2,r=700+rnd()*600,s=Math.sqrt(1-u*u);
    pos.set([r*s*Math.cos(th),r*u,r*s*Math.sin(th)],i*3);
    const k=.55+rnd()*.45,warm=rnd();col.set([k,k*(.86+warm*.14),k*(.75+(1-warm)*.25)],i*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true})));
})();

scene.add(new THREE.AmbientLight(0x8fa0c8,.16));
scene.add(new THREE.PointLight(0xfff1d6,1.9,0));

const meshes=[],labels=[],navBtns=[];
BODIES.forEach((b,i)=>{
  const geo=new THREE.SphereGeometry(b.r,48,32);
  const mat=i===0?new THREE.MeshBasicMaterial({map:tex(b)}):new THREE.MeshStandardMaterial({map:tex(b),roughness:.9,metalness:0});
  const m=new THREE.Mesh(geo,mat);m.userData.i=i;
  const pivot=new THREE.Group();pivot.add(m);scene.add(pivot);
  m.rotation.z=b.tilt||0;
  b.pivot=pivot;b.mesh=m;b.a=rnd()*Math.PI*2;b.w=b.p?(.32/Math.pow(b.p,.62)):0;
  meshes.push(m);
  if(i===0){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
    s.scale.set(44,44,1);pivot.add(s);
  }else{
    const pts=[];for(let k=0;k<=180;k++){const a=k/180*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*b.d,0,Math.sin(a)*b.d))}
    scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts.slice(0,180)),
      new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.1})));
  }
  if(b.ring){
    [[1.25,1.55,.55],[1.6,2.0,.75],[2.06,2.3,.35]].forEach(q=>{
      const r=new THREE.Mesh(new THREE.RingGeometry(b.r*q[0],b.r*q[1],96),
        new THREE.MeshBasicMaterial({color:0xd9c79a,side:THREE.DoubleSide,transparent:true,opacity:q[2]}));
      r.rotation.x=Math.PI/2;m.add(r);
    });
  }
  if(b.moon){
    b.moonMesh=new THREE.Mesh(new THREE.SphereGeometry(.27,20,14),new THREE.MeshStandardMaterial({color:0xbfc3c9,roughness:1}));
    pivot.add(b.moonMesh);
  }
  const l=document.createElement('div');l.className='lbl';l.textContent=b.n;l.onclick=()=>focus(i);
  document.body.appendChild(l);labels.push(l);
  const nb=document.createElement('button');nb.innerHTML='<i style="background:'+b.c+'"></i>'+b.n;nb.onclick=()=>focus(i);
  $('nav').appendChild(nb);navBtns.push(nb);
});

/* state */
let sel=-1,flyT=1,speed=1,playing=true,simT=0;
const goal=new THREE.Vector3(),tgt=new THREE.Vector3(),prev=new THREE.Vector3(),v=new THREE.Vector3();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){speed=.3;$('speed').value=.3;$('spv').textContent='0.3×'}

function focus(i){
  sel=i;flyT=0;
  navBtns.forEach((b,k)=>b.classList.toggle('on',k===i));
  const c=$('card');
  if(i<0){c.classList.remove('show');return}
  const b=BODIES[i];
  $('kind').textContent=b.k;$('name').textContent=b.n;$('desc').textContent=b.desc;
  $('facts').innerHTML=b.f.map(f=>'<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>').join('');
  c.style.setProperty('--accent',b.c);c.classList.add('show');
  prev.copy(b.pivot.position);
}
$('close').onclick=$('home').onclick=()=>focus(-1);
$('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};
$('speed').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed.toFixed(1)+'×'};
addEventListener('keydown',e=>{if(e.key==='Escape')focus(-1)});
ctl.addEventListener('start',()=>{if(flyT<1)flyT=1});

/* click picking (ignore drags) */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let dx=0,dy=0;
renderer.domElement.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-dx,e.clientY-dy)>6)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,cam);
  const h=ray.intersectObjects(meshes,false)[0];
  if(h)focus(h.object.userData.i);
});

function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  if(playing)simT+=dt*speed;
  const step=playing?dt*speed:0;
  BODIES.forEach((b,i)=>{
    if(i){const a=b.a+simT*b.w;b.pivot.position.set(Math.cos(a)*b.d,0,Math.sin(a)*b.d)}
    b.mesh.rotation.y+=step*(i?.6:.08);
    if(b.moonMesh){const a=simT*2.4;b.moonMesh.position.set(Math.cos(a)*2,.15,Math.sin(a)*2)}
  });

  const k=1-Math.exp(-dt*3.2);
  if(sel>=0){
    const b=BODIES[sel],p=b.pivot.position;
    if(flyT<1){
      flyT+=dt/1.8;
      v.copy(cam.position).sub(p);v.y=Math.max(v.y,v.length()*.25);v.normalize().multiplyScalar(b.r*4.2+4);
      goal.copy(p).add(v);cam.position.lerp(goal,k);ctl.target.lerp(p,k*1.4);
    }else{
      v.copy(p).sub(prev);cam.position.add(v);ctl.target.add(v);
    }
    prev.copy(p);
  }else if(flyT<1){
    flyT+=dt/2.2;cam.position.lerp(HOME,k);ctl.target.lerp(tgt.set(0,0,0),k);
  }
  ctl.update();
  renderer.render(scene,cam);

  const w=innerWidth,h=innerHeight;
  BODIES.forEach((b,i)=>{
    const l=labels[i];
    v.copy(b.pivot.position);v.y+=b.r*(b.ring?1.5:1.15);v.project(cam);
    if(v.z>1||i===sel){l.style.display='none';return}
    l.style.display='';l.style.left=((v.x+1)/2*w)+'px';l.style.top=((1-v.y)/2*h-4)+'px';
  });
}
flyT=0;frame();
})();
</script>
</body>
</html>
